<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Galpón BARON — 3D 360°</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe3e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#view{width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.92);box-shadow:0 4px 18px rgba(0,0,0,.15);backdrop-filter:blur(10px);z-index:3}
#ui b{font-size:16px}#ui span{font-size:12px;line-height:1.4}
#hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.68);color:#fff;border-radius:20px;padding:9px 14px;font-size:12px;z-index:3;white-space:nowrap}
button{border:0;border-radius:10px;padding:7px 10px;background:#222;color:#fff;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui"><b>Galpón — 3D 360°</b><br><span>Modelo preliminar basado en el plano catastral · 10,00 × 9,68 m aprox. · entrepiso parcial</span></div>
<div id="hint">Deslizá para girar · pellizcá para acercar</div>
<script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
let cw=innerWidth,ch=innerHeight,dpr=1;
let yaw=.65,pitch=.28,zoom=1,drag=false,lx=0,ly=0, pinchDist=0;
function fit(){dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',fit);fit();

const O=[];
function B(x,y,z,sx,sy,sz,c,e=true){O.push({x,y,z,sx,sy,sz,c,e})}
const wall='#b9b9b9', floor='#747474', slab='#8b8b8b', metal='#4c5053', wood='#9a866c';
B(0,-.12,0,10,.24,9.68,floor,false);
B(-4.91,3.5,0,.18,7,9.68,wall);
B(4.91,3.5,0,.18,7,9.68,wall);
B(0,3.5,-4.75,10,7,.18,wall);
B(0,6.88,4.75,10,.24,.22,metal);B(0,6.88,-4.75,10,.24,.22,metal);

// Entrepiso: volumen parcial interpretado del plano.
B(-.35,4.68,-2.80,8.1,.24,4.1,slab);
B(-.35,5.38,-.75,8.1,.10,.10,metal);
for(let i=0;i<=10;i++)B(-4.4+i*.81,5.08,-.75,.055,.62,.055,metal);

// Columnas de referencia.
for(const x of [-4.82,4.82])for(const z of [-4.66,4.66])B(x,3.5,z,.22,7,.22,metal);

// Escalera representativa del dibujo.
const sx=-2.8,sz=1.7,n=15,rise=4.8/n,run=.22;
for(let i=0;i<n;i++)B(sx,rise*(i+.5),sz-i*run,1.5,rise,(i+1)*run,wood);
B(sx,4.72,sz-n*run,1.5,.16,.75,wood);

function R(p){let[x,y,z]=p,cy=Math.cos(yaw),sy=Math.sin(yaw);let X=x*cy-z*sy,Z=x*sy+z*cy,cp=Math.cos(pitch),sp=Math.sin(pitch);return[X,y*cp-Z*sp,y*sp+Z*cp]}
function P(p){let q=R(p),s=Math.min(cw,ch)*.78*zoom/(16+q[2]);return[cw/2+q[0]*s,ch*.57-q[1]*s,s]}
function corners(o){let{x,y,z,sx,sy,sz}=o,X=sx/2,Y=sy/2,Z=sz/2;return[[x-X,y-Y,z-Z],[x+X,y-Y,z-Z],[x+X,y+Y,z-Z],[x-X,y+Y,z-Z],[x-X,y-Y,z+Z],[x+X,y-Y,z+Z],[x+X,y+Y,z+Z],[x-X,y+Y,z+Z]]}
function frame(){
ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#dfe3e6';ctx.fillRect(0,0,cw,ch);
let F=[];
for(const o of O){let p=corners(o),q=p.map(P),fs=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[0,3,7,4],[1,5,6,2]];
for(const f of fs){let pts=f.map(i=>q[i]),z=f.reduce((a,i)=>a+R(p[i])[2],0)/4;F.push({pts,z,c:o.c,e:o.e})}}
F.sort((a,b)=>b.z-a.z);
for(const f of F){ctx.beginPath();ctx.moveTo(f.pts[0][0],f.pts[0][1]);for(let i=1;i<f.pts.length;i++)ctx.lineTo(f.pts[i][0],f.pts[i][1]);ctx.closePath();ctx.fillStyle=f.c;ctx.fill();if(f.e){ctx.strokeStyle='rgba(20,20,20,.23)';ctx.lineWidth=.7;ctx.stroke()}}
requestAnimationFrame(frame)}
frame();

canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw+=dx*.008;pitch+=dy*.006;pitch=Math.max(-.8,Math.min(.9,pitch))});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);zoom=Math.max(.55,Math.min(2.2,zoom))},{passive:false});
const t=new Map();
canvas.addEventListener('touchstart',e=>{for(const a of e.changedTouches)t.set(a.identifier,[a.clientX,a.clientY]);if(t.size===2){let a=[...t.values()];pinchDist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}},{passive:false});
canvas.addEventListener('touchmove',e=>{if(t.size!==2)return;e.preventDefault();for(const a of e.changedTouches)if(t.has(a.identifier))t.set(a.identifier,[a.clientX,a.clientY]);let a=[...t.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinchDist){zoom*=d/pinchDist;zoom=Math.max(.55,Math.min(2.2,zoom))}pinchDist=d},{passive:false});
canvas.addEventListener('touchend',e=>{for(const a of e.changedTouches)t.delete(a.identifier)});
</script>
</body>
</html>
